
snapshots:
  - name: "Check_snapshot_1_Stg_Orders"
    description: "Check snapshot of stg__orders"
    relation: ref('stg__orders')
    config:
      schema: snapshots
      strategy: check
      check_cols: all
      unique_key: order_id
  
  - name: "Timestamp_snapshot_2_Stg_Orders"
    description: "Timestamp snapshot of stg__orders"
    relation: ref('stg__orders')
    config:
      schema: snapshots
      strategy: timestamp
      updated_at: order_datetime
      unique_key: order_id
