models:

  - name: products
    description: 'Table des numéro produits'
    columns:
      - name: num_region
        description: 'Numéro de région'
        data_type: NUMBER 
      - name: product_name
        description: 'Nom du produit'
        data_type: VARCHAR 
      - name: product_category
        description: 'Catégorie du produit'
        data_type: VARCHAR 
      - name: product_type
        description: 'Type du produit'
        data_type: Varchar 
      - name: stock
        description: 'Stock du produit'
        data_type: NUMBER 
      - name: weight
        description: 'Poids du produit'
        data_type: NUMBER 
      - name: shipping_cost
        description: 'Cout de livraison'
        data_type: NUMBER 
      - name: product_price
        description: 'Prix du produit'
        data_type: NUMBER 